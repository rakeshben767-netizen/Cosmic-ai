name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "JAVA_HOME=${JAVA_HOME:-UNSET}"
          if ! command -v java >/dev/null 2>&1; then
            echo "Error: java executable could not be detected."
            exit 1
          fi
          java -version
          JAVA_VER_LINE=$(java -version 2>&1 | head -n 1)
          JAVA_MAJOR=$(echo "$JAVA_VER_LINE" | sed -E 's/.*version "([0-9]+)(\.[0-9]+)?.*".*/\1/')
          if ! [[ "$JAVA_MAJOR" =~ ^[0-9]+$ ]]; then
            echo "Error: Could not parse active Java major version from: $JAVA_VER_LINE"
            exit 1
          fi
          echo "Detected Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "Error: Java 17 or newer is required, found Java $JAVA_MAJOR."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f "./debug.keystore" ]; then
            KEYTOOL_BIN="${JAVA_HOME}/bin/keytool"
            if [ ! -x "$KEYTOOL_BIN" ]; then
              KEYTOOL_BIN="keytool"
            fi
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi
          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "Error: Failed to create temporary ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore ready for this runner."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ] || [[ "$APK_PATH" != *.apk ]]; then
            echo "Error: Expected debug APK not found or empty at $APK_PATH."
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered files under app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name "*.apk" || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Verified debug APK: $APK_PATH ($(wc -c < "$APK_PATH") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ] || [ ! -s "$APK_FILE" ]; then
            echo "Error: Expected APK missing or empty at $APK_FILE."
            exit 1
          fi

          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          gh release create "$TAG_NAME" "app/build/outputs/apk/debug/app-debug.apk" \
            --title "$RELEASE_TITLE" \
            --target "$GITHUB_SHA" \
            --latest \
            --notes "Automatically generated debug APK built by GitHub Actions.

          - Run number: ${GITHUB_RUN_NUMBER}
          - Run attempt: ${GITHUB_RUN_ATTEMPT}
          - Source commit: ${GITHUB_SHA}
          - Intended for testing only (not a Play Store production release).
          - Signed only with a temporary debug keystore."

          ASSET_COUNT=$(gh release view "$TAG_NAME" --json assets --jq '[.assets[] | select(.name == "app-debug.apk")] | length')
          if [ "$ASSET_COUNT" -lt 1 ]; then
            echo "Error: Release $TAG_NAME was created but app-debug.apk asset is missing."
            exit 1
          fi
          echo "Verified release $TAG_NAME contains app-debug.apk ($ASSET_COUNT match)."

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          DIRECT_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/app-debug.apk"
          TAG_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/app-debug.apk"

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            gh release view "$TAG_NAME" --json tagName,name,url,assets --template 'Tag: {{.tagName}}{{"\n"}}Title: {{.name}}{{"\n"}}URL: {{.url}}{{"\n"}}Assets: {{range .assets}}{{.name}} ({{.size}} bytes){{"\n"}}{{end}}'
            echo "Asset filename: app-debug.apk"
            echo "TAGGED APK DOWNLOAD: $TAG_URL"
            echo "DIRECT APK DOWNLOAD: $DIRECT_URL"
            {
              echo "### DIRECT APK DOWNLOAD"
              echo "$DIRECT_URL"
              echo ""
              echo "- Tagged download URL (immediate): $TAG_URL"
              echo "- Releases page: https://github.com/${GITHUB_REPOSITORY}/releases"
              echo "- Release tag: \`$TAG_NAME\`"
              echo "- Asset filename: \`app-debug.apk\`"
              echo "- Backup GitHub Actions artifact \`app-debug-apk\` remains available."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed for tag $TAG_NAME."
            if [ "${{ steps.upload_artifact.outcome }}" = "success" ]; then
              echo "APK build succeeded and backup Actions artifact 'app-debug-apk' remains available."
              {
                echo "### GitHub Release Publishing Failed"
                echo "The debug APK build succeeded and the backup GitHub Actions artifact \`app-debug-apk\` remains available."
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "APK build or artifact upload did not complete successfully."
            fi
          fi
