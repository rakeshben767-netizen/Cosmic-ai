[versions]
agp = "9.1.1"
coreKtx = "1.15.0"
appcompat = "1.7.0"
activityKtx = "1.9.3"
webkit = "1.12.1"
lifecycleRuntimeKtx = "2.8.7"
coroutinesAndroid = "1.9.0"
material = "1.12.0"
unityAds = "4.22.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "webkit" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutinesAndroid" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
unity-ads = { group = "com.unity3d.ads", name = "unity-ads", version.ref = "unityAds" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
